<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>حراج Blox Fruits</title>
  <style>
    :root {
      --bg-color: #121824;
      --card-bg: #1c2536;
      --accent-color: #10b981;
      --accent-hover: #059669;
      --text-color: #f3f4f6;
      --border-color: #374151;
      --danger-color: #ef4444;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
      direction: rtl;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .lang-btn {
      background: var(--border-color);
      color: var(--text-color);
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
    }

    .warning-banner {
      background-color: rgba(239, 68, 68, 0.15);
      border: 1px solid var(--danger-color);
      color: #fca5a5;
      padding: 10px;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-bottom: 20px;
      text-align: center;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
      font-size: 0.9rem;
    }

    select, input {
      width: 100%;
      padding: 10px;
      background: var(--bg-color);
      border: 1px solid var(--border-color);
      color: var(--text-color);
      border-radius: 6px;
      box-sizing: border-box;
    }

    .submit-btn {
      width: 100%;
      padding: 12px;
      background: var(--accent-color);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    .submit-btn:hover {
      background: var(--accent-hover);
    }

    .trades-list {
      margin-top: 30px;
    }

    .trade-card {
      background: var(--bg-color);
      border: 1px solid var(--border-color);
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 15px;
    }

    .trade-header {
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 5px;
      margin-bottom: 10px;
    }

    .quick-replies {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .reply-btn {
      background: var(--border-color);
      color: var(--text-color);
      border: none;
      padding: 5px 10px;
      font-size: 0.8rem;
      border-radius: 4px;
      cursor: pointer;
    }

    .reply-btn:hover {
      background: var(--accent-color);
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h2 id="title">حراج Blox Fruits</h2>
    <button class="lang-btn" onclick="toggleLanguage()" id="langBtn">English</button>
  </div>

  <!-- تنبيه الحماية المسؤولية -->
  <div class="warning-banner" id="warningBanner">
    ⚠️ الموقع غير مسؤول إطلاقاً إذا تمت المبادلة أو التعامل على شيء خارج نطاق حراج أو الموقع.
  </div>

  <form id="tradeForm" onsubmit="event.preventDefault(); addTrade();">
    
    <!-- 1. اسم الحساب في الأعلى -->
    <div class="form-group">
      <label id="lblUser">اسم حسابك للتواصل (روبلوكس / ديسكورد):</label>
      <input type="text" id="username" placeholder="مثال: RobloxUser123" required>
    </div>

    <!-- 2. نوع العملية -->
    <div class="form-group">
      <label id="lblType">نوع العملية:</label>
      <select id="tradeType" onchange="updateFormFields()">
        <option value="trade">تداول (مقايضة)</option>
        <option value="sell">بيع</option>
        <option value="search">أبحث عن</option>
      </select>
    </div>

    <!-- 3. حالة الفاكهة -->
    <div class="form-group">
      <label id="lblState">حالة الفاكهة:</label>
      <select id="fruitState">
        <option value="physical">عادية (Physical)</option>
        <option value="perm">دائمة (Perm)</option>
      </select>
    </div>

    <!-- خانات ديناميكية حسب نوع العملية -->
    <div id="dynamicFields">
      <!-- الخانة الأولى: الفاكهة المعروضة / المتوفرة -->
      <div class="form-group" id="offeredGroup">
        <label id="lblOffered">الفاكهة المعروضة / المتوفرة:</label>
        <select id="offeredFruit"></select>
      </div>

      <!-- الخانة الثانية: الفاكهة المطلوبة أو السعر -->
      <div class="form-group" id="requestedGroup">
        <label id="lblRequested">الفاكهة المطلوبة / أو السعر:</label>
        <select id="requestedFruit"></select>
        <input type="text" id="priceInput" class="hidden" placeholder="حدد السعر المطلوب...">
      </div>
    </div>

    <!-- زر النشر -->
    <button type="submit" class="submit-btn" id="submitBtn" onclick="handlePublishClick()">نشر العرض فوراً</button>
  </form>

  <hr style="margin: 30px 0; border-color: var(--border-color);">

  <h3 id="lblRecent">أحدث عروض التداول والبيع</h3>
  <div class="trades-list" id="tradesList">
    <p id="noTradesText" style="text-align: center; color: #888;">لا توجد عروض حالياً، كن أول من ينشر عرضاً!</p>
  </div>
</div>

<script>
  // قائمة جميع فواكه اللعبة من Rocket إلى Dragon
  const allFruits = [
    "Rocket", "Spin", "Blade", "Spring", "Bomb", "Smoke", "Spike", "Flame", 
    "Falcon", "Ice", "Sand", "Dark", "Diamond", "Light", "Rubber", "Barrier", 
    "Ghost", "Magma", "Quake", "Buddha", "Love", "Spider", "Sound", "Phoenix", 
    "Portal", "Rumble", "Pain", "Blizzard", "Gravity", "Mammoth", "T-Rex", 
    "Dough", "Shadow", "Venom", "Control", "Spirit", "Dragon", "Leopard", "Kitsune"
  ];

  // الردود السريعة الجاهزة
  const quickRepliesArr = [
    "أنا لدي عرض",
    "تعال إلى الخاص",
    "هل تقبل المقايضة؟",
    "هل تريد أن تبيعها؟",
    "أعطني عرضك"
  ];

  let currentLang = 'ar';
  let publishClickCount = 0;
  let clickTimer = null;

  // تهيئة الفواكه
  function populateFruits() {
    const offeredSelect = document.getElementById('offeredFruit');
    const requestedSelect = document.getElementById('requestedFruit');
    
    offeredSelect.innerHTML = '<option value="">-- اختر الفاكهة --</option>';
    requestedSelect.innerHTML = '<option value="">-- اختر الفاكهة أو "عرض كويس" --</option><option value="عرض كويس">عرض كويس (بدون اشتراط)</option>';

    allFruits.forEach(fruit => {
      offeredSelect.innerHTML += `<option value="${fruit}">${fruit}</option>`;
      requestedSelect.innerHTML += `<option value="${fruit}">${fruit}</option>`;
    });
  }

  // تحديث الخانات حسب خيار العملية (تداول، بيع، أبحث عن)
  function updateFormFields() {
    const type = document.getElementById('tradeType').value;
    const offeredGroup = document.getElementById('offeredGroup');
    const requestedGroup = document.getElementById('requestedGroup');
    const requestedFruit = document.getElementById('requestedFruit');
    const priceInput = document.getElementById('priceInput');

    if (type === 'search') {
      // أبحث عن: خيار الفاكهة المطلوب نوعها وحالتها فقط
      offeredGroup.classList.add('hidden');
      requestedGroup.classList.remove('hidden');
      requestedFruit.classList.remove('hidden');
      priceInput.classList.add('hidden');
      document.getElementById('lblRequested').innerText = currentLang === 'ar' ? 'الفاكهة المطلوبة:' : 'Requested Fruit:';
    } else if (type === 'sell') {
      // بيع: تحديد الفاكهة والسعر
      offeredGroup.classList.remove('hidden');
      requestedGroup.classList.remove('hidden');
      requestedFruit.classList.add('hidden');
      priceInput.classList.remove('hidden');
      document.getElementById('lblOffered').innerText = currentLang === 'ar' ? 'الفاكهة للبيع:' : 'Fruit for Sale:';
      document.getElementById('lblRequested').innerText = currentLang === 'ar' ? 'السعر المطلوب:' : 'Price:';
    } else {
      // تداول / مقايضة
      offeredGroup.classList.remove('hidden');
      requestedGroup.classList.remove('hidden');
      requestedFruit.classList.remove('hidden');
      priceInput.classList.add('hidden');
      document.getElementById('lblOffered').innerText = currentLang === 'ar' ? 'الفاكهة المعروضة / المتوفرة:' : 'Offered Fruit:';
      document.getElementById('lblRequested').innerText = currentLang === 'ar' ? 'الفاكهة المطلوبة / أو السعر:' : 'Requested Fruit / Price:';
    }
  }

  // نظام الضغط 7 مرات للأدمن
  function handlePublishClick() {
    publishClickCount++;
    if (clickTimer) clearTimeout(clickTimer);

    if (publishClickCount === 7) {
      publishClickCount = 0;
      const code = prompt(currentLang === 'ar' ? "أدخل رمز الأدمن:" : "Enter Admin Code:");
      if (code === "kokusen1") {
        alert("مرحباً بالأدمن ياسر");
      } else if (code === "songoku2") {
        alert("مرحباً بالأدمن أصيل");
      } else if (code) {
        alert(currentLang === 'ar' ? "رمز خاطئ!" : "Incorrect Code!");
      }
    } else {
      clickTimer = setTimeout(() => { publishClickCount = 0; }, 2000);
    }
  }

  // إضافة عرض جديد
  function addTrade() {
    const username = document.getElementById('username').value;
    const type = document.getElementById('tradeType').value;
    const state = document.getElementById('fruitState').value;
    const offered = document.getElementById('offeredFruit').value;
    const requested = document.getElementById('requestedFruit').value;
    const price = document.getElementById('priceInput').value;

    if (!username) return;

    const noTradesText = document.getElementById('noTradesText');
    if (noTradesText) noTradesText.remove();

    const tradesList = document.getElementById('tradesList');
    const card = document.createElement('div');
    card.className = 'trade-card';

    let details = '';
    let typeLabel = type === 'sell' ? 'بيع' : type === 'search' ? 'أبحث عن' : 'تداول';

    if (type === 'search') {
      details = `يبحث عن: <b>${requested}</b> (${state === 'perm' ? 'دائمة' : 'عادية'})`;
    } else if (type === 'sell') {
      details = `يعرض: <b>${offered}</b> (${state === 'perm' ? 'دائمة' : 'عادية'}) | السعر: <b>${price}</b>`;
    } else {
      details = `يعرض: <b>${offered}</b> (${state === 'perm' ? 'دائمة' : 'عادية'}) 🔁 يطلب: <b>${requested}</b>`;
    }

    let quickRepliesHtml = '<div class="quick-replies">';
    quickRepliesArr.forEach(reply => {
      quickRepliesHtml += `<button class="reply-btn" onclick="alert('تم إرسال الرد: ${reply}')">${reply}</button>`;
    });
    quickRepliesHtml += '</div>';

    card.innerHTML = `
      <div class="trade-header">
        <span>👤 <b>${username}</b></span>
        <span style="color: var(--accent-color); font-weight: bold;">[${typeLabel}]</span>
      </div>
      <div>${details}</div>
      ${quickRepliesHtml}
    `;

    tradesList.prepend(card);
    document.getElementById('tradeForm').reset();
    updateFormFields();
  }

  // تبديل اللغة مع تعريب كافة العناوين بدقة
  function toggleLanguage() {
    currentLang = currentLang === 'ar' ? 'en' : 'ar';
    document.dir = currentLang === 'ar' ? 'rtl' : 'ltr';

    document.getElementById('title').innerText = currentLang === 'ar' ? 'حراج Blox Fruits' : 'Blox Fruits Market';
    document.getElementById('langBtn').innerText = currentLang === 'ar' ? 'English' : 'عربي';
    document.getElementById('warningBanner').innerText = currentLang === 'ar' ? 
      '⚠️ الموقع غير مسؤول إطلاقاً إذا تمت المبادلة أو التعامل على شيء خارج نطاق حراج أو الموقع.' : 
      '⚠️ The site is not responsible for trades made outside of the platform.';

    document.getElementById('lblUser').innerText = currentLang === 'ar' ? 'اسم حسابك للتواصل (روبلوكس / ديسكورد):' : 'Username (Roblox / Discord):';
    document.getElementById('lblType').innerText = currentLang === 'ar' ? 'نوع العملية:' : 'Operation Type:';
    document.getElementById('lblState').innerText = currentLang === 'ar' ? 'حالة الفاكهة:' : 'Fruit State:';
    document.getElementById('submitBtn').innerText = currentLang === 'ar' ? 'نشر العرض فوراً' : 'Publish Offer Now';
    document.getElementById('lblRecent').innerText = currentLang === 'ar' ? 'أحدث عروض التداول والبيع' : 'Recent Trades & Sales';

    updateFormFields();
  }

  // التهيئة عند التحميل
  populateFruits();
  updateFormFields();
</script>

</body>
</html>
